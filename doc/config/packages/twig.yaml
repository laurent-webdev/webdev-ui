twig:
    file_name_pattern: '*.twig'
    globals:
        # Les couleurs des .theme-* et des utilitaires, pour les boucles des démos
        colors: [primary, secondary, accent, success, danger, warning, info, neutral, inverse]
        # Pages de la doc, dans l'ordre du menu (base.html.twig). Une page = [route, libellé, template].
        # Ajouter une page : sa ligne ici, sa méthode dans le contrôleur de sa section, son template.
        doc_sections:
            - id: custom
              label: Personnalisation
              links:
                  - [app_breakpoints, Breakpoints, custom/breakpoints.html.twig]
                  - [app_variables, Variables, custom/variables.html.twig]
            - id: component
              label: Composants
              links:
                  - [app_accordion, Accordéon, components/accordion.html.twig]
                  - [app_alert, Alerte, components/alert.html.twig]
                  - [app_badge, Badge, components/badge.html.twig]
                  - [app_button, Bouton, components/button.html.twig]
                  - [app_btn_close, Bouton de fermeture, components/btn-close.html.twig]
                  - [app_card, Carte, components/card.html.twig]
                  - [app_dialog, Dialogue, components/dialog.html.twig]
                  - [app_drawer, Drawer, components/drawer.html.twig]
                  - [app_dropdown, Dropdown, components/dropdown.html.twig]
                  - [app_form, Formulaire, components/form.html.twig]
                  - [app_link, Lien, components/link.html.twig]
                  - [app_list, Liste, components/list.html.twig]
                  - [app_tab, Onglets, components/tab.html.twig]
                  - [app_spinner, Spinner, components/spinner.html.twig]
            - id: layout
              label: Mise en page
              links:
                  - [app_container, Container, layouts/container.html.twig]
                  - [app_grid, Grille, layouts/grid.html.twig]
            - id: utility
              label: Utilitaires
              links:
                  - [app_animation, Animation, utilities/animation.html.twig]
                  - [app_aspect_ratio, Aspect-ratio, utilities/aspect-ratio.html.twig]
                  - [app_border, Bordures, utilities/border.html.twig]
                  - [app_colors, Couleurs, utilities/colors.html.twig]
                  - [app_cursor, Curseur, utilities/cursor.html.twig]
                  - [app_display, Display, utilities/display.html.twig]
                  - [app_spacing, Espacements, utilities/spacing.html.twig]
                  - [app_flex, Flex, utilities/flex.html.twig]
                  - [app_gap, Gap, utilities/gap.html.twig]
                  - [app_sizing, Largeur et hauteur, utilities/sizing.html.twig]
                  - [app_object_fit, Object-fit, utilities/object-fit.html.twig]
                  - [app_box_shadow, Ombres, utilities/box-shadow.html.twig]
                  - [app_opacity, Opacité, utilities/opacity.html.twig]
                  - [app_overflow, Overflow, utilities/overflow.html.twig]
                  - [app_position, Position, utilities/position.html.twig]
                  - [app_text, Texte, utilities/text.html.twig]
                  - [app_font, Typographie, utilities/font.html.twig]
                  - [app_vertical_align, Vertical-align, utilities/vertical-align.html.twig]
                  - [app_visibility, Visibilité, utilities/visibility.html.twig]
                  - [app_visually_hidden, Visually-hidden, utilities/visually-hidden.html.twig]

when@test:
    twig:
        strict_variables: true
